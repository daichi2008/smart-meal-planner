services:
  - type: web
    name: smart-meal-planner-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '*'
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      # AdvCash Configuration
      - key: ADVCASH_ACCOUNT_EMAIL
        sync: false
      - key: ADVCASH_SCI_NAME
        sync: false
      - key: ADVCASH_SCI_PASSWORD
        sync: false
      - key: ADVCASH_CURRENCY
        value: USD
      - key: ADVCASH_PLAN_PRICE_USD
        value: 6.0
      - key: ADVCASH_SUBSCRIPTION_DAYS
        value: 30
      # Volet Payment Gateway Configuration
      - key: VOLET_MERCHANT_ID
        sync: false
      - key: VOLET_API_KEY
        sync: false
      - key: VOLET_SECRET_KEY
        sync: false
      - key: VOLET_WEEKLY_PRICE_USD
        value: 2.0
      - key: VOLET_MONTHLY_PRICE_USD
        value: 7.0
      - key: VOLET_WEEKLY_SUBSCRIPTION_DAYS
        value: 7
      - key: VOLET_MONTHLY_SUBSCRIPTION_DAYS
        value: 30
